<style>
:root{--bg:#fff1c9;--card:#fff;--ink:#2a2340;--sea:#7fd0e8;--pri:#e8453c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-reduced-motion:reduce){#op .run{animation:none;left:40%}.car,.act .in{transition:none;animation:none}#dice.sp{animation:none}.cf{display:none}}

#dice{box-shadow:0 6px 0 var(--ink),inset 0 -6px 0 #ddd;font-size:64px}#dice.sp{animation:tum .5s ease-in-out infinite}
@keyframes tum{0%{transform:translateY(0) rotate(0)}40%{transform:translateY(-24px) rotate(200deg)}70%{transform:translateY(0) rotate(320deg) scale(1.1,.88)}100%{transform:translateY(0) rotate(360deg)}}
svg.b{box-shadow:0 6px 0 var(--ink);border-width:5px}.pc{box-shadow:3px 3px 0 var(--ink)}#log{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.car use{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
.ov{background:radial-gradient(circle,rgba(255,255,255,.25),rgba(30,20,60,.82))}
.pp{--c:#7b4dd9;overflow:hidden;animation:pin .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 8px 0 var(--ink)}@keyframes pin{from{transform:scale(.6) rotate(-5deg);opacity:0}}
.pp h2{background:var(--c);color:#fff;margin:-18px -18px 14px;padding:12px;border-bottom:4px solid var(--ink);font-size:22px}
#op{background:repeating-conic-gradient(#ffd23f 0 10deg,#fff1c9 10deg 20deg)}#op #go{animation:bl 1s steps(2) infinite}@keyframes bl{50%{filter:brightness(1.2)}}
.gb{position:fixed;inset:0;display:grid;place-items:center;z-index:70;pointer-events:none}.gb b{font:clamp(48px,16vw,120px) "Dela Gothic One",sans-serif;color:#ffd23f;-webkit-text-stroke:3px #2a2340;text-shadow:5px 5px 0 #e8453c;animation:gbk 2.2s ease-out forwards}
@keyframes gbk{0%{transform:scale(0) rotate(-10deg)}20%{transform:scale(1.2) rotate(3deg)}30%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.warn{font-size:11px;opacity:.75;background:none;color:var(--ink);text-align:center;margin-top:12px}
@media(max-width:600px){main{padding:8px 6px}.sign h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){.pp,#dice.sp,.sign::before,#op #go,.gb b{animation:none}}
</style></head><body>

<svg class="run" width="70" height="36" viewBox="-20 -12 40 24"><use href="#c0"/></svg><svg class="run" style="animation-delay:.4s;bottom:22%" width="70" height="36" viewBox="-20 -12 40 24"><use href="#c1"/></svg><svg class="run" style="animation-delay:.8s;bottom:30%" width="70" height="36" viewBox="-20 -12 40 24"><use href="#c2"/></svg></div>
<script id="lg">
// ===== ゲームロジック(画面に依存しない部品。後でサーバー側にそのまま移せる) =====
// 設定: ここを書き換えれば、ターン数・確率・文言を変えられます
const CFG={MAX_ROUNDS:10,CHANCE:.2};// 1ラウンド=3人が1回ずつ
const CELLS=[["高知駅","s",350,244],["桂浜","n",382,262],["はりまや橋","n",335,232],["ひろめ市場","f",305,215],["久万高原","q",265,190],["道後温泉","l",190,170],["松山城","n",210,150],["みかん畑","f",215,130],["今治タオル","n",237,112],["来島海峡大橋","r",272,100],["新居浜","n",305,118],["観音寺","q",375,82],["丸亀城","n",415,65],["讃岐うどん","f",440,62],["高松","n",460,50],["屋島","o",495,44],["瀬戸大橋","n",480,10],["児島","l",465,-14],["倉敷","n",445,-30],["岡山駅","g",432,-48]];
const GOAL=CELLS.length-1;
// イベントの文言: [タイトル, 説明]。d=進むマス数(マイナスは戻る)。行を足すだけで増やせます
const EVENTS={f:{i:"🍜",d:1,L:[["かつおのたたき","高知名物!わら焼きの香りにみんなごきげん。"],["鯛めし","愛媛の郷土料理をぺろり。"],["骨付鳥","香川のスパイシーな味に元気100倍!"],["徳島ラーメン","濃いめのスープでパワー充填!"]]},
l:{i:"🍀",d:2,L:[["道後の湯でぽかぽか","追い風を受けて快調!"],["遍路道でお接待","親切にパワーアップ!"],["瀬戸内の夕日","景色にみとれて気分上々!"]]},
r:{i:"🚀",d:3,L:[["ロケット発進!","しまなみ海道を一気に駆け抜ける!"],["快速ルート発見","高速道路がすいすい!"]]},
o:{i:"🌀",d:-1,L:[["道に迷った","うどん屋の行列で足止め…"],["おみやげ買いすぎ","荷物が重くて少しもどる…"],["フェリーを乗りまちがえ","ちょっと遠回り…"]]}};
// クイズ: [問題,[選択肢],正解の番号]
const QUIZ=[["かつおのたたきを焼くときに使う昔ながらの燃料は?",["わら","石炭","ガス"],0],["道後温泉本館があるのは何県?",["香川県","愛媛県","徳島県"],1],["さぬきうどんで有名なのは何県?",["香川県","高知県","愛媛県"],0],["鳴門の渦潮が見られるのは何県?",["徳島県","愛媛県","高知県"],0],["瀬戸大橋は香川県と何県をつなぐ?",["広島県","岡山県","兵庫県"],1],["今治が産地として有名なのは?",["タオル","漆器","和紙"],0],["高知出身の幕末の志士は?",["坂本龍馬","西郷隆盛","勝海舟"],0],["高知の清流として有名な川は?",["四万十川","信濃川","利根川"],0]];
const newState=()=>({seq:0,turn:0,pos:[0,0,0],done:[0,0,0],q:[],pend:null,over:null});
// 状態遷移: action.seq が現在の seq と違えば無視(二重実行の防止)。乱数は action が持つ(サーバー検証用)
function reduce(S,a){if(!a||a.seq!==S.seq||S.over)return null;S=JSON.parse(JSON.stringify(S));S.seq++;const fx=[],p=S.turn%3;
const mv=d=>{const from=S.pos[p],to=Math.max(0,Math.min(GOAL,from+d));S.pos[p]=to;if(to==GOAL)S.done[p]=1;fx.push({t:"move",p,from,to})};
if(a.type=="roll"){if(S.pend)return null;fx.push({t:"dice",p,n:a.n});mv(a.n);S.q=[];const k=CELLS[S.pos[p]][1];
if(!S.done[p]){if("fqlro".includes(k))S.q.push(k);if(a.n==6)S.q.push("fqlro"[a.b%5]);else if(k=="n"&&a.r<CFG.CHANCE)S.q.push("flo"[a.b%3])}}
else if(a.type=="answer"){if(S.pend==null)return null;const q=QUIZ[S.pend],ok=a.i==q[2];fx.push({t:"result",p,ok,ans:q[1][q[2]]});S.pend=null;if(ok)mv(2)}else return null;
while(S.q.length&&!S.done[p]){const k=S.q.shift();if(k=="q"){S.pend=a.qi%QUIZ.length;fx.push({t:"quiz",p,qi:S.pend});return{S,fx}}const E=EVENTS[k];fx.push({t:"ev",p,k,v:a.v%E.L.length});mv(E.d)}
S.q=[];if(S.done.every(Boolean))S.over="win";else{do{S.turn++}while(S.done[S.turn%3]);if(S.turn>=CFG.MAX_ROUNDS*3)S.over="time"}
fx.push({t:"end"});return{S,fx}}
const rnd=()=>({n:1+(Math.random()*6|0),b:Math.random()*60|0,r:Math.random(),v:Math.random()*60|0,qi:Math.random()*60|0});
</script>
<script>
const $=s=>document.querySelector(s),wt=ms=>new Promise(r=>setTimeout(r,ms)),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const PL=[{n:"まさみ",c:"#e8453c",b:"み"},{n:"まさき",c:"#2f6fdb",b:"き"},{n:"はやと",c:"#f2b01e",b:"と"}],EM={s:"🏁",f:"🍜",q:"❓",l:"🍀",r:"🚀",o:"🌀",g:"🚉",n:""},BG={s:"#fff",f:"#ff9f43",q:"#a77bff",l:"#4cd68a",r:"#ff5a5a",o:"#b8b8c8",g:"#ffd23f",n:"#fff"};
let S,view,busy;
["#pth","#pth2"].forEach(s=>$(s).setAttribute("d","M"+CELLS.map(c=>c[2]+","+c[3]).join("L")));
$("#cells").innerHTML=CELLS.map((c,i)=>`<circle cx="${c[2]}" cy="${c[3]}" r="13.5" fill="${BG[c[1]]}" stroke="#2a2340" stroke-width="3"/><text x="${c[2]}" y="${c[3]+5}" font-size="${EM[c[1]]?15:11}" text-anchor="middle" font-weight="700" fill="#2a2340">${EM[c[1]]||i}</text>`).join("");
$("#cars").innerHTML=PL.map((p,i)=>`<g class="car" id="car${i}"><g class="in"><ellipse cy="12" rx="17" ry="4" fill="#000" opacity=".25"/><use href="#c${i}"/><circle cy="-17" r="8" fill="${p.c}" stroke="#2a2340" stroke-width="2.5"/><text y="-13.5" font-size="10" font-weight="800" text-anchor="middle" fill="${i==2?"#2a2340":"#fff"}">${p.b}</text></g></g>`).join("");
const SL=[[-15,-19],[15,-19],[0,19]],place=i=>{const c=CELLS[view[i]];$("#car"+i).style.transform=`translate(${c[2]+SL[i][0]}px,${c[3]+SL[i][1]}px)`};
const log=t=>{const d=document.createElement("div");d.textContent=t;$("#log").prepend(d);while($("#log").children.length>5)$("#log").lastChild.remove()};
function ui(){const p=S.turn%3;$("#pl").innerHTML=PL.map((q,i)=>`<div class="pc ${i==p&&!S.over?"on":""}" style="border-color:${q.c}"><b>${q.n}</b><br>${S.done[i]&&view[i]==19?"🏁ゴール!":CELLS[view[i]][0]}</div>`).join("");
PL.forEach((_,i)=>$("#car"+i).classList.toggle("act",i==p&&!S.over));$("#turn").textContent=S.over?"ゲーム終了":`${PL[p].n}の番(${Math.floor(S.turn/3)+1}/${CFG.MAX_ROUNDS}ラウンド)`;$("#roll").disabled=busy||!!S.over}
function init(){S=newState();view=[0,0,0];busy=false;$("#log").innerHTML="";PL.forEach((_,i)=>place(i));log("スタート!サイコロを振って岡山駅をめざそう。");ui()}
function pop(t,b,btns=["OK"],col="#7b4dd9"){return new Promise(r=>{$(".pp").style.setProperty("--c",col);$("#pt").innerHTML=t;$("#pb").innerHTML=b;$("#pbtn").innerHTML=btns.map((x,i)=>`<button class="btn" data-i="${i}">${x}</button>`).join("");$("#pop").style.display="grid";$("#pbtn").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;$("#pbtn").onclick=null;$("#pop").style.display="none";r(+i)}})}
const hop=i=>$("#car"+i).querySelector(".in").animate([{transform:"translateY(0)"},{transform:"translateY(-12px) scale(1.1)"},{transform:"translateY(0)"}],{duration:260});
function ping(i){const c=CELLS[view[i]],g=$("#pg");g.setAttribute("cx",c[2]);g.setAttribute("cy",c[3]);g.animate([{transform:"scale(1)",opacity:.9},{transform:"scale(2.3)",opacity:0}],{duration:450})}
// ゴール演出の差し込み口:ここを書き換えれば演出を豪華にできます
function goalBanner(){const d=document.createElement("div");d.className="gb";d.innerHTML="<b>GOAL!</b>";document.body.appendChild(d);return wt(RM?600:2200).then(()=>d.remove())}
async function play(fx){for(const f of fx){const P=PL[f.p]?.n;
if(f.t=="dice"){const d=$("#dice");d.classList.add("sp");for(let i=0;i<7;i++){d.textContent=String.fromCodePoint(9855+(1+Math.random()*6|0));await wt(RM?30:100)}d.classList.remove("sp");d.textContent=String.fromCodePoint(9855+f.n);if(!RM)d.animate([{transform:"scale(1.35)"},{transform:"scale(.92)"},{transform:"scale(1)"}],{duration:320});log(P+":"+f.n+"が出た!");await wt(RM?0:250)}

function shares(e){const s=e.sp.filter(x=>P.some(p=>p.id==x)),n=s.length,o={};if(!n)return o;const b=Math.floor(e.amt/n),r=e.amt-b*n,k=[...String(e.id)].reduce((a,c)=>a+c.charCodeAt(0),0)%n;s.forEach((x,i)=>o[x]=b+((i+k)%n<r?1:0));return o}

function calc(D){const t={total:0,paid:{},share:{},cnt:{},net:{},bal:{}};P.forEach(p=>t.paid[p.id]=t.share[p.id]=t.cnt[p.id]=0);

if(a!="go")return tt("復元をやめました。いまのデータは変更していません。");break}
if(!bkApply(r.data))return bmsg(false,"復元に失敗しました。いまのデータはそのまま残っています。");
bmsg(true,"✅ 復元しました。旅程 "+m.itin+"件 / 予約 "+m.book+"件 / 支出 "+m.exp+"件 / 精算 "+m.pay+"件 / 予算 "+bu(r.data.bud)+"。各画面に反映されています。")}

async function bkUndo(){let o;try{o=JSON.parse(lsg(PK))}catch(e){}

async function sha(t){return[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hyt"+t)))].map(x=>x.toString(16).padStart(2,"0")).join("")}
